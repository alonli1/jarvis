name: on-demand-literature-watch

on:
  workflow_dispatch:
    inputs:
      days:
        description: Recent publication window in days
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync

      - name: Run literature watch
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run jarvis watch --days "${{ inputs.days }}"

      - name: Commit report
        shell: bash
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add literature/reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "literature watch: $(date +%F)"
            git push
          fi
