version: 1
description: Controlled research tags used for retrieval and literature graphs.
research_tags:
  automated_eft_matching:
    label: Automated EFT matching
    any: [automation, automated_matching, matching_tools, matchete, matchmakereft]
    phrases: [automated matching, automated eft matching]
  inverse_uv_reconstruction:
    label: Inverse UV reconstruction
    any: [inverse_matching, uv_ir_dictionary, uv_reconstruction]
    phrases: [inverse eft matching, inverse matching, uv reconstruction]
  gravitational_eft:
    label: Gravitational EFT
    any: [gravitational_eft, gravity_eft]
    all: [gravity, eft]
    phrases: [gravitational eft, eft of gravity, gravitational effective field theory]
  one_loop_effective_action:
    label: One-loop effective actions
    any: [one_loop_matching, uolea, functional_methods, cde, covariant_derivative_expansion]
    phrases: [one-loop matching, one loop matching, universal one-loop effective action]
  curved_spacetime_qft:
    label: QFT in curved spacetime
    any: [curved_spacetime, heat_kernel, curvature_expansion]
    phrases: [curved spacetime, heat kernel, curvature expansion]
  spin_2_consistency:
    label: Spin-2 consistency and emergent gravity
    any: [spin2, massive_gravity, emergent_gravity, diffeomorphism_invariance]
    phrases: [spin-2, spin 2, massive gravity, emergent gravity]
  classical_gravity_observables:
    label: Classical gravity observables
    any: [binary_dynamics, post_minkowskian, worldline, nrgr, classical_gravity]
    phrases: [post-minkowskian, binary dynamics, classical gravity observables]
  quantum_gravity_rg:
    label: Quantum-gravity renormalization group
    any: [asymptotic_safety, frg, quantum_gravity_rg]
    phrases: [asymptotic safety, functional renormalization group]
  computational_qft_tools:
    label: Computational QFT tools
    any: [symbolic_computation, tensor_reduction, amplitude_tools, matching_tools, automation]
    phrases: [symbolic computation, computational qft, matching software]
  smeft_uv_dictionary:
    label: SMEFT UV dictionaries
    any: [uv_ir_dictionary, tree_matching, operator_basis]
    all: [smeft, matching]
    phrases: [smeft uv dictionary, smeft matching]
  renormalization_and_eft:
    label: Renormalization and effective field theory
    any: [renormalization, effective_field_theory, wilson_coefficients, operator_mixing]
    phrases: [renormalization group, wilson coefficient, effective field theory]
  black_hole_physics:
    label: Black-hole physics
    any: [black_holes, horizons, hawking_radiation, tidal_response]
    phrases: [black hole, event horizon, hawking radiation, tidal response]
  quantum_cosmology:
    label: Quantum cosmology
    any: [quantum_cosmology, inflation, early_universe, cosmological_perturbations]
    phrases: [quantum cosmology, early universe, cosmological perturbation]
  scattering_amplitudes:
    label: Scattering amplitudes
    any: [amplitudes, unitarity, double_copy, on_shell_methods]
    phrases: [scattering amplitude, double copy, unitarity cut, on-shell method]
  canonical_quantum_gravity:
    label: Canonical quantum gravity
    any: [canonical_gravity, loop_quantum_gravity, hamiltonian_constraint]
    phrases: [canonical quantum gravity, loop quantum gravity, hamiltonian constraint]
  path_integral_quantum_gravity:
    label: Path-integral quantum gravity
    any: [path_integral, causal_dynamical_triangulations, spin_foams]
    phrases: [gravitational path integral, causal dynamical triangulation, spin foam]
  quantum_information_gravity:
    label: Quantum information and gravity
    any: [entanglement, holography, quantum_information, complexity]
    phrases: [quantum information, entanglement entropy, holographic complexity]
  semiclassical_gravity:
    label: Semiclassical gravity
    any: [semiclassical_gravity, backreaction, stress_energy_tensor, particle_creation]
    phrases: [semiclassical gravity, semiclassical einstein equation, particle creation]
  gravitational_observables:
    label: Gravitational observables
    any: [observables, gravitational_waves, lensing, memory_effect, ppn]
    phrases: [gravitational observable, gravitational wave, memory effect, ppn parameter]
