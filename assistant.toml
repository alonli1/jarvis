[assistant]
name = "Jarvis"
default_model = "ollama/qwen3:14b"
max_context_chunks = 10

[model_profiles.local]
model = "ollama/qwen3:14b"
capability = "science_fast"

[index]
mode = "local"
path = ".jarvis/qdrant"
url = "http://localhost:6333"
collection = "jarvis_chunks"
dense_model = "BAAI/bge-small-en-v1.5"
sparse_model = "Qdrant/bm25"
dense_limit = 30
sparse_limit = 30

[retrieval]
chunk_chars = 3200
chunk_overlap = 400
final_k = 10

[literature]
default_days = 2
max_results_per_query = 40
user_agent = "Jarvis/0.1 research-assistant"

[novelty]
high_threshold = 0.62
critical_threshold = 0.78
medium_threshold = 0.42

[dropbox]
# Public PKCE application key. A group administrator may commit it here, or each
# researcher may set JARVIS_DROPBOX_APP_KEY before running `jarvis setup`.
app_key = "9s700q8g1sjp0c4"
