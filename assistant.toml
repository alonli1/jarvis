[assistant]
name = "Group Physics Assistant"
default_model = "ollama/qwen3:14b"
max_context_chunks = 10

[index]
mode = "local"
path = ".physai/qdrant"
url = "http://localhost:6333"
collection = "physai_chunks"
dense_model = "BAAI/bge-small-en-v1.5"
sparse_model = "Qdrant/bm25"
dense_limit = 30
sparse_limit = 30

[retrieval]
chunk_chars = 3200
chunk_overlap = 400
final_k = 10

[privacy]
local_model_prefixes = ["ollama/", "local/", "vllm/"]
external_default_max_visibility = "public"
local_default_max_visibility = "confidential"

[literature]
default_days = 2
max_results_per_query = 40
user_agent = "PhysAI/0.1 research-assistant"

[novelty]
high_threshold = 0.62
critical_threshold = 0.78
medium_threshold = 0.42
